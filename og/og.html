<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Geist Mono";
        src: url("./fonts/GeistMono-Variable.woff2") format("woff2");
        font-style: normal;
        font-weight: 100 900;
        font-display: block;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        background: #000;
      }

      body {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 72px;
        color: #f2f2ef;
        font-family: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
        -webkit-font-smoothing: antialiased;
      }

      h1 {
        margin: 0;
        font-size: 96px;
        font-weight: 500;
        letter-spacing: -0.045em;
        line-height: 1;
      }

      .role {
        margin: 24px 0 0;
        color: #9cc7a4;
        font-size: 30px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <h1>Mohamed Sami</h1>
    <p class="role">Software Engineer at Headout</p>
  </body>
</html>

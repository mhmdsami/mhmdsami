<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Geist Mono";
        src: url("./fonts/GeistMono-Variable.woff2") format("woff2");
        font-style: normal;
        font-weight: 100 900;
        font-display: block;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #000;
      }

      body {
        display: grid;
        place-items: center;
        color: #9cc7a4;
      }

      .s {
        font-family: "Geist Mono", ui-monospace, monospace;
        font-style: normal;
        font-weight: 200;
        font-size: 60vmin;
        line-height: 1;
        letter-spacing: -0.04em;
        transform: translateY(-1%);
      }
    </style>
  </head>
  <body>
    <span class="s">s</span>
  </body>
</html>

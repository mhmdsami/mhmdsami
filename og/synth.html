<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Geist Mono";
        src: url("./fonts/GeistMono-Variable.woff2") format("woff2");
        font-style: normal;
        font-weight: 100 900;
        font-display: block;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        background: #000;
      }

      body {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px;
        color: #f2f2ef;
        font-family: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
        -webkit-font-smoothing: antialiased;
      }

      .eyebrow {
        margin: 0;
        color: #8f8f8a;
        font-size: 24px;
        letter-spacing: 0.02em;
      }

      h1 {
        margin: 0;
        font-size: 120px;
        font-weight: 500;
        letter-spacing: -0.05em;
        line-height: 1;
      }

      .role {
        margin: 20px 0 0;
        color: #9cc7a4;
        font-size: 32px;
        line-height: 1.4;
      }

      .foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #6f6f6a;
        font-size: 24px;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #9cc7a4;
      }
    </style>
  </head>
  <body>
    <p class="eyebrow">sam1.space / labs / synth</p>
    <div>
      <h1>Synth</h1>
      <p class="role">a year of github as drums</p>
    </div>
    <div class="foot">
      <span>sam1.space/labs/synth</span>
      <span class="dot"></span>
    </div>
  </body>
</html>

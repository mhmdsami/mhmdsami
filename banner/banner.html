      .wisp {
        fill: none;
        stroke: rgb(156 199 164 / 70%);
        stroke-width: 2.2;
        stroke-linecap: round;
        transform-box: fill-box;
        transform-origin: center bottom;

    <script>
      const time = (Number(new URLSearchParams(location.search).get("t")) || 0) / 1000;

      const typing = document.querySelector("#typing");
      const caret = document.querySelector("#caret");
      const led = document.querySelector("#led");

      const typeWidth = Math.min(1, (time % 2) / 1.45) * 140;
      typing.setAttribute("width", String(typeWidth));
      caret.setAttribute("x", String(40 + typeWidth + 4));

      const blink = time % 1 < 0.5;
      caret.style.opacity = blink ? "1" : "0";
      led.style.opacity = String(0.4 + 0.6 * (0.5 + 0.5 * Math.sin(time * Math.PI)));

      document.querySelectorAll(".wisp").forEach((el, index) => {
        const phase = ((time / 2) + index / 3) % 1;
        el.style.opacity = String(Math.sin(phase * Math.PI) * 0.65);
        el.style.transform = `translateY(${-phase * 20}px) scale(${0.85 + phase * 0.25})`;
      });
